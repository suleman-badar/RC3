services:
  api:
    build: ./server
    env_file:
      - ./server/.env
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=8)); assert r['db'] == 'ok'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  web:
    build: ./client
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

